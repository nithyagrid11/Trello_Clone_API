services:
  backend:
    build: .
    container_name: backend

    ports:
      - "8000:8000"

    env_file:
      - .env

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend